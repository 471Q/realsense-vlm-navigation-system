# =========================
# Per-frame Pipeline Parameters
# =========================
#
# Thresholds the perception path reads at startup. No logic lives here. A value in this file is
# a choice someone made, not a fact about the world, and it is kept out of the code so that
# retuning it is an edit rather than a search.
#
# The file's digest is folded into `runtime_configuration_hash` and recorded with every run, so two
# runs carrying the same hash were configured identically.
#
# **Every block below is read by the live pipeline**, except `free_space`, which is marked. Four
# blocks that nothing read were removed on 23 August 2026: `open_vocab`, eighteen prompts for an
# open-vocabulary detector the system does not use; `depth.monocular_bins_norm` and `depth.mode`,
# for a camera with no depth sensor, where the D455f has one and `source_depth` is hardcoded to
# rgbd; `uncertainty_thresholds`, whose two values were never computed and whose `low_light` was
# hardcoded false; and `output_schema_fields`, a description of a record shape written in prose
# beside four JSON Schema files that describe the same thing and are enforced. Each read as an
# active part of the specification and was not one.
#
# Read by `realsense_shared_control.py` and `realsense_vlm_on_change_qwen.py` on the live path, and
# by five older standalone scripts that are not part of the current system.

depth:
  # Distance bands. Every detected object is labelled with the band its measured distance falls in,
  # so a caption can say "near" without reciting a number, and so `_multi_near_count` can ask how
  # many objects are close without a second threshold.
  #
  # These are presentation bands. They are not safety thresholds, and nothing that decides motion
  # reads them. Two things did, and both were corrected on 23 August 2026.
  #
  # `blocked_threshold_m` was taken from `very_close[1]`, so retuning a display band for readability
  # moved the distance at which a sector is declared impassable. It now reads
  # `risk_rules_baseline.stop.nearest_obstacle_m_lt`, which holds the same number in the place that
  # means it.
  #
  # The `caution:multi_near` rule counted objects whose band was very_close or near, which is a rule
  # deciding motion reading a word that describes a measurement rather than the measurement. It now
  # counts objects measured below `risk_rules_baseline.caution.nearest_obstacle_m_lt`. The count is
  # unchanged, very_close and near together being everything below 1.50 m, which is that same
  # distance. The sentence above was written earlier the same day and was false when written; this
  # rule was the exception to it.
  #
  # The bands are still repeated in `hdsg_runtime.DISTANCE_BANDS_M`, which derives an object's band
  # from its measured distance rather than accepting the label the detector supplied.
  # `tests/test_runtime_authority.py` fails if the two copies disagree, so a retune here that is not
  # carried across is caught rather than silently ignored.
  metric_bins_m:
    very_close: [0.0, 0.7]
    near:       [0.7, 1.5]
    mid:        [1.5, 3.0]
    far:        [3.0, 99.0]

bearing:
  # Where the image is divided into left, centre and right. The fraction is the horizontal centre of
  # a detection's bounding box over the image width, so a box centred in the leftmost third is left
  # and one past two thirds is right.
  left_max:  0.33
  right_min: 0.66

free_space:
  # Whether the walker fits through the gap ahead, which is a different question from how far away
  # the nearest object is. A corridor can be clear for four metres and still too narrow to enter.
  #
  # NOT YET IMPLEMENTED. `corridor_min_width_m` is set to None at every site that builds a scene, so
  # the `stop:corridor_narrow` rule below has never fired. The parameters are retained rather than
  # removed because the measurement is wanted, and are to be measured in the laboratory.
  #
  # **Why the existing sector clearances cannot answer this.** `compute_lane_state` splits the image
  # into three fixed vertical bands and takes the median depth in each, which reports how far the
  # camera can see in each band. The bands are fixed in the image, not in the world: the centre band
  # covers roughly 0.6 m of real width at 1 m and 1.9 m at 3 m. Distance and width are different
  # measurements and neither implies the other, so a doorway 0.75 m wide reads as a clear centre.
  #
  # **The measurement.** For each sampled row of the depth image, find the longest unbroken run of
  # columns whose depth is at least the lookahead distance. Convert that run from pixels to metres
  # as `width_m = pixels * depth_m / fx`, where fx is the depth stream's horizontal focal length in
  # pixels. fx is not currently read; it comes from the RealSense stream profile beside where
  # `depth_scale` is read at startup. Take the narrowest run across the sampled rows.
  #
  # **Open, to be settled from measurements taken in the laboratory. Do not pick defaults for these.**
  #   1. The walker's width at its widest point in normal use, usually the handgrips or the rear
  #      legs. Every threshold here is relative to it and it is not recorded anywhere in the repo.
  #   2. The clearance margin a person who is unsteady needs beyond that width. `min_gap_width_m`
  #      below is 0.60, narrower than most walkers, so it was never a considered value.
  #   3. Whether to report the narrowest gap anywhere within stopping range, or the gap at a fixed
  #      lookahead. The first is the safer reading and costs nothing extra.
  #   4. The camera's height above the floor and its tilt. Without these, image rows cannot be
  #      converted to physical heights, and the measurement can only be taken across a band of rows
  #      as `compute_lane_state` already does, which makes the height approximate rather than
  #      metric. It matters because a doorway is clear at floor level and narrows at handle height,
  #      and a table is clear underneath and blocked at waist height, so the gap has to be measured
  #      across a range of heights rather than one.
  #
  # These four are collected with everything else blocked on the laboratory in
  # `thesis/Claude Session/LAB_SESSION_CHECKLIST.md`, sections A and B2. Section B2 lists the gap
  # scenes to capture with their true widths measured, without which a computed width can be
  # plotted but not checked.
  central_wedge_deg: 20  # +/- degrees around the centreline searched for the gap
  sample_rows: 12        # how many rows of the depth image the width is measured across
  min_gap_width_m: 0.60  # placeholder, see open question 2

risk_rules_baseline:
  # The object advisory: SAFE, CAUTION or STOP, computed by `compute_baseline_risk` and passed to
  # `determine_authority` as the object side of the decision. The sector side is computed
  # separately from the depth image.
  #
  # Two of the six rules below cannot fire as the system stands, and are kept because the
  # measurements they need are wanted rather than abandoned:
  #   `corridor_min_width_m_lt`  needs free_space above, which is not implemented.
  #   `hazard_within_m_lte`      needs an object mapped to ontology_class hazard. No COCO class
  #                              reaches it, so the hazard list is always empty. This is the cost of
  #                              the deferred decision on how stairs are detected.
  # Both are owned: see `LAB_SESSION_CHECKLIST.md`, sections A and D. A third, `high_uncertainty`,
  # was replaced by `min_valid_depth_fraction` on 23 August 2026 and now fires.
  #
  # What runs today is: stop under 0.70 m; caution under 1.50 m, or with two or more objects
  # nearby, or with less than half the reasoning band carrying a depth reading.
  stop:
    nearest_obstacle_m_lt: 0.70
    corridor_min_width_m_lt: 0.60
    hazard_within_m_lte: 2.0
  caution:
    nearest_obstacle_m_lt: 1.50
    multi_near_objects_count_gte: 2
    # Caution when less than half the reasoning band carries a usable depth reading.
    #
    # This replaced `high_uncertainty` on 23 August 2026, which tested a low-light flag written as
    # False on every frame beside a `low_light_gray_mean_lt: 40` nothing computed. Measuring the
    # backlit staircase captures showed that threshold also pointed the wrong way: those frames
    # average 101 grey and are brighter than the ordinary room at 73 to 94. The adverse condition
    # is high contrast, not darkness.
    #
    # 0.50 is not fitted to the sample. Below half, the sector medians that drive the decision are
    # computed from a minority of the region, which is a statement about the measurement rather
    # than about seven frames. It sits well inside the observed gap: the backlit captures return
    # 17.6 to 36.8 per cent valid depth in this band, the ordinary room 71.7 to 72.0. Provisional
    # until the laboratory captures give a distribution, and deliberately CAUTION rather than STOP,
    # because a false caution costs an unnecessary explanation and a false stop costs a journey.
    min_valid_depth_fraction: 0.50

sector:
  # The three sector clearances, computed from the depth image rather than from detected objects.
  # A sector reading below `blocked_below_m` is BLOCKED, below `clear_at_or_above_m` is CONSTRAINED,
  # and at or above it is CLEAR.
  #
  # `blocked_below_m` is not repeated here. It is the same distance as
  # `risk_rules_baseline.stop.nearest_obstacle_m_lt` above and is read from there, so the distance
  # at which the walker stops has one home whether the thing in the way was detected as an object
  # or measured as depth.
  #
  # 1.8 rather than 2.0 because every run in the archive was recorded at 1.8, which was the command
  # line's default while every test packet recorded 2.0 in the field that states how a run was
  # configured. Made consistent 23 August 2026; the value itself awaits a measurement at the
  # laboratory and is not settled.
  clear_at_or_above_m: 1.8
