# ============================================
# Safety ontology for an indoor home environment
# ============================================
#
# WHAT THIS FILE IS FOR
#
# The object detector produces one word for each thing it finds, chosen from a fixed list. This file
# does two jobs with that word. It may give the word a plain replacement that the spoken description
# uses instead, and it puts the word into a group.
#
# WHAT THE GROUP CHANGES
#
# Only one group changes what the walker does. Anything in `hazard` makes the walker stop 2.00 m
# away. Everything else, including the catch-all `unknown_obstacle`, makes it stop 0.70 m away. So a
# mistake in `hazard` is a safety mistake, and a mistake anywhere else produces a badly worded
# description rather than a dangerous one. The two names `hazard` and `unknown_obstacle` are read by
# the code and must not be renamed here; the rest are free.
#
# **`hazard` is unreachable by the detector in use.** None of its eight words is a COCO class and no
# synonym routes a COCO class into it, so the 2.00 m stopping distance has never been applied to
# anything. Stairs, ramps, escalators, wet floors and pool edges are all equally invisible. This is
# an open decision, not an oversight: how a fall is to be detected is item 5 of the deferred
# register and is measured at the laboratory. See `LAB_SESSION_CHECKLIST.md`.
#
# TWO VOCABULARIES, AND ONLY ONE IS LOADED
#
# The detector in use is `yolov8n.pt`, whose vocabulary is COCO's 80 words. The file also carries
# Open Images V7 words, 601 of them, from the two days in August 2026 when that detector was tried.
# It was reverted because it found almost nothing: over 1412 recorded frames it produced 1247
# detections against COCO's 1911, no furniture at all, and 926 empty frames against 349.
#
# The Open Images entries are kept rather than deleted because switching detector is a live option
# for the hazard problem above, and rebuilding three hundred mappings under time pressure would be
# worse than carrying them. They are dormant: no COCO word reaches them.
#
# **`not_obstacles` is the exception and is held to a stricter rule.** Every other section here
# affects only the wording of a description, so a wrong entry costs a clumsy sentence.
# `not_obstacles` deletes a detection outright and is the only way for the walker to ignore
# something the camera saw, so a wrong entry costs an obstacle. An entry there is valid only against
# a vocabulary the system is actually running, and switching detector requires rebuilding it against
# the new vocabulary rather than inheriting the old one.
#
# WHAT THE FILE DOES NOT DO
#
# It no longer renames a word that was already plain. Until 23 August 2026 it carried the renames
# written for Open Images, which says "Kitchen & dining room table" and "Waste container" and
# genuinely needs them. COCO's words are ordinary English, so those renames only made them vaguer:
# `vase` was presented to the model as "plant", `laptop` and `keyboard` both as "computer",
# `stop sign` as "post", and seven animals as "animal", in a file that argues elsewhere that
# "a dog is ahead" is worth saying because it tells somebody something they can act on. Those words
# are now canonical entries in their groups, so each keeps its own name and its group. Four renames
# survive because they genuinely read better: `dining table`, `tv`, `refrigerator`, `cell phone`.
#
# HOW A WORD IS MATCHED
#
# The detector's word is lowercased and looked up in `not_obstacles` first, and a match there ends
# it: the detection is thrown away before it becomes a fact. Otherwise the word is looked up in
# `synonyms_to_canonical`, then in the `canonical` lists. The match is exact. There is no
# approximate matching, because when there was, a stop sign was matched to a staircase and treated
# as a fall hazard, and a necktie was matched to a person.
#
# A word matching nothing becomes `unknown_obstacle`, which is still an obstacle and still stops the
# walker at 0.70 m. It keeps its own word in the description, so an unmapped word is not a silent
# one. Twenty-four COCO classes are in this position, mostly tableware and food.
#
# `prompts` is a separate list, offered to an open-vocabulary detector that accepts words at run
# time rather than having them trained in. A word found only there gives the group but no name, so
# the detector's own word survives into the description. No detector in use reads it.
#
# WHO THIS IS WRITTEN FOR
#
# A home. The previous version was written for a hospital and grouped a bed as something that rolls,
# which is true of a hospital bed on castors and false of a bed in a bedroom. Rewritten for a home
# on 22 August 2026, confirmed that date. Section 10.8 of `HDSG_VERIFIED_GENERATION_POLICY.md`
# records the change.

ontology:

  # ---- Things that move on their own and cannot be predicted ----

  - name: person
    canonical: [person]
    prompts: ["person", "human", "visitor", "carer", "child", "bystander"]

  - name: animal
    # A pet is the thing most likely to be underfoot in a house, and it is worth naming rather than
    # calling an obstacle, because "a dog is ahead" tells somebody something they can act on.
    # Wild animals are included because naming one costs nothing and the catch-all names nothing.
    #
    # The seven COCO animals are canonical entries rather than synonyms onto `animal`. They were
    # synonyms until 23 August 2026, so the model was told "animal" when the detector had said
    # "horse", which is the opposite of the argument above.
    canonical: [dog, cat, bird, rabbit, hamster, fish, animal,
                bear, cow, elephant, giraffe, horse, sheep, zebra]
    prompts: ["dog", "cat", "pet", "bird", "rabbit"]

  - name: mobility_aid
    # Another person's walking equipment, or the user's own spare. Open Images has wheelchair and
    # crutch and has no word for a walking frame or a rollator, so those names are reachable only
    # through the prompt list or a detector trained later.
    canonical: [wheelchair, crutch, walker, pram]
    prompts: ["wheelchair", "mobility scooter", "walker", "walking frame", "rollator", "pram",
              "stroller", "buggy", "pushchair", "crutch", "walking stick", "cane"]

  # ---- The group that changes the stopping distance ----

  - name: hazard
    # A fall, not an obstruction. Everything here makes the walker stop 2.00 m away instead of
    # 0.70 m, which is the only behavioural difference any group makes.
    #
    # `stairs` carries no direction because the detector's word carries none: Open Images says
    # `Stairs` whether the walker is at the top or the bottom. `stairs_up` and `stairs_down` are
    # kept because the wording code already handles them and a detector trained later could tell
    # them apart, but nothing emits either today.
    #
    # `swimming pool` is here because a pool edge is an unguarded fall of over a metre. It is the
    # only outdoor fall the detector can name.
    #
    # `ladder` is deliberately NOT here. The medium Open Images model labels the one staircase in
    # the recordings `Ladder` at 0.30 confidence, which is a reason to look again and not a reason
    # to move it. Putting a class in this group because one model confused it once is exactly the
    # mistake that put a stop sign here. It sits in `furniture` until the lab recordings settle it.
    canonical: [stairs, stairs_up, stairs_down, ramp, drop_off, escalator, wet_floor_sign,
                swimming pool]
    prompts: ["stairs", "staircase", "steps", "step down", "ramp", "kerb", "curb", "threshold",
              "drop-off", "edge", "escalator", "wet floor sign", "spill", "loose rug"]

  # ---- Things you pass through rather than around ----

  - name: doorway
    canonical: [door, doorway, gate]
    prompts: ["door", "doorway", "gate", "sliding door", "french doors", "archway", "hallway"]

  # ---- Things that stay where they are ----

  - name: furniture
    # Everything a room is furnished with, whether or not it is fixed down. A single group rather
    # than separate ones for seating, tables and storage, because the walker treats them all the
    # same and splitting them only creates more places to file something wrongly.
    canonical: [chair, stool, couch, bench, table, desk, bed, cot, wardrobe, cabinet, cupboard,
                drawers, bookcase, shelf, rack, mattress, mirror, curtain, lamp, rug, cushion,
                ladder, pet bed,
                fireplace, radiator, piano, sculpture, plant, picture, clothes rail, tripod,
                exercise machine, ironing board, pillar, post, fountain,
                # `whiteboard` was in this list before the rewrite and was lost by accident.
                # A freestanding board on castors is a thing to steer around. A generic name
                # is kept for `Furniture`, which the detector emits when it recognises a piece
                # of furniture without deciding which.
                whiteboard, furniture, musical instrument,
                # COCO words, canonical rather than synonyms, so each keeps its own name. They were
                # renamed until 23 August 2026: `vase` was presented as "plant", which is false of
                # an empty one, and `stop sign`, `traffic light`, `fire hydrant` and `parking meter`
                # all became "post". They are outdoor objects, and a walker used near a front door
                # will see them.
                vase, potted plant, stop sign, traffic light, fire hydrant, parking meter]
    prompts: ["chair", "armchair", "sofa", "table", "coffee table", "desk", "bed", "wardrobe",
              "chest of drawers", "bookcase", "shelf", "sideboard", "radiator", "floor lamp",
              "rug", "houseplant", "pillar", "post"]

  - name: appliance
    # Kitchen and utility machines. Separate from furniture because they are the fixed points of a
    # kitchen and naming one places a person in the room better than "furniture" does.
    canonical: [fridge, oven, hob, microwave, dishwasher, washing machine, television, monitor,
                computer, printer, kettle, toaster, coffee machine, heater, fan, vacuum cleaner, small appliance,
                sewing machine, telephone,
                # COCO words, canonical rather than synonyms. `laptop` and `keyboard` were both
                # renamed to "computer" until 23 August 2026, so two different objects reached
                # the description as one word.
                laptop, keyboard, hair drier]
    prompts: ["fridge", "refrigerator", "oven", "cooker", "hob", "microwave", "dishwasher",
              "washing machine", "tumble dryer", "television", "radiator", "heater"]

  - name: bathroom_fixture
    canonical: [toilet, sink, bath, shower, bathroom fitting]
    prompts: ["toilet", "sink", "basin", "bath", "bathtub", "shower", "shower tray"]

  # ---- Things left on the floor, which move between one day and the next ----

  - name: floor_object
    # The trip hazards of a house. Grouped apart from furniture because a bag in a hallway is there
    # today and gone tomorrow, and because it is the group a person can do something about.
    canonical: [bag, box, basket, bin, suitcase, luggage, toy, ball, shoes, book, bottle, bucket,
                cable, laundry, container, barrel, tool, umbrella, tent,
                # Bathroom scales sit on the floor and are the right height to catch a wheel.
                # Sports equipment and a board leaning on a wall are in a hallway as often as
                # they are in a cupboard.
                scales, sports equipment, board, medical equipment,
                # COCO words, canonical rather than synonyms, so each keeps its own name.
                # `backpack` and `handbag` were both "bag"; `teddy bear` and `kite` were both
                # "toy"; three separate boards were "board". A teddy bear on a floor is worth
                # naming, because it says a child lives here.
                backpack, handbag, teddy bear, kite, frisbee, sports ball, baseball bat,
                tennis racket, skis, snowboard, surfboard]
    prompts: ["bag", "box", "cardboard box", "basket", "bin", "suitcase", "toy", "shoes", "cable",
              "laundry basket", "washing basket", "clutter"]

  # ---- Things on wheels ----

  - name: wheeled_object
    # Anything that could roll if it were nudged, or that is being pushed by somebody. A separate
    # group because a thing on wheels may not be where it was a moment ago.
    canonical: [bicycle, motorcycle, car, van, bus, truck, trolley, skateboard, scooter,
                roller skates, stretcher, wheelbarrow, lawn mower]
    prompts: ["bicycle", "trolley", "cart", "shopping trolley", "pushchair", "wheelie bin",
              "lawn mower", "car"]

  - name: unknown_obstacle
    # The catch-all. A thing here is still an obstacle and still stops the walker at 0.70 m; it
    # simply has no name the description may use, so it is described as an obstacle.
    canonical: [unknown]
    prompts: []

# ---------------------------------------------------------------------------
# Detector words folded onto a name.
#
# The left side is what the detector emits, lowercased. The right side must be a name that appears
# in one of the `canonical` lists above, or the word ends up in the catch-all by a longer route
# while this file reads as though it works. A test checks that.
# ---------------------------------------------------------------------------

