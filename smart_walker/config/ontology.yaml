# ---------------------------------------------------------------------------
# Words the detector reports that are never a thing on the floor to steer around.
#
# These are thrown away before they become facts, which makes this the only mechanism that can make
# the walker ignore something the camera saw. Every other section in this file affects only wording.
#
# **An entry is valid only against a vocabulary the system is actually running.** Switching detector
# requires rebuilding this list against the new vocabulary rather than inheriting the old one. That
# rule is written here because the list was not rebuilt when it should have been: 84 entries were
# added on 22 August 2026 for Open Images V7, the detector was reverted to COCO the same day, and 82
# of them survived as rules against words the loaded detector cannot say. The removed list is kept
# at `thesis/Claude Session/_removed_not_obstacles_openimages.txt`.
#
# Two of the 84 were live under COCO. `clock` is no longer here: a wall clock means there is a wall,
# and there is no `wall` class for the wall to be reported as, so discarding the clock reports
# nothing at all for that surface. The same argument removed `window`, `poster`, `picture frame`,
# `building` and `house`, and applies to them if the list is ever restored. Confirmed 23 August 2026.
#
# The single entry that survives is a genuine double count: COCO reports `person` and `tie` as two
# detections of the same body at the same distance, so without it one visitor is named twice.
#
# The word that forced the original list was `window`. Every Open Images model tested reported
# `Window` in all three recorded stair frames at 0.49 to 0.71 confidence, more confidently than it
# reported the staircase, because the stairwell is lit from behind by a large window. That is a
# reason to distrust that detector's ranking, not a reason to blind the walker to a wall.
# ---------------------------------------------------------------------------

not_obstacles:

  # Part of a person the detector already reports separately.
  - tie

# A `mapping:` block configuring embedding similarity and a language model fallback was removed on
# 22 August 2026. Nothing read it. It described the approximate matching that the mapper used to
# perform, which sent a stop sign to the stairs group and a necktie to the person group, and which
# was replaced by exact matching. Matching is now a lookup with no configuration.
