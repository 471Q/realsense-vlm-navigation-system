# ---------------------------------------------------------------------------
# Words the detector reports that are never a thing on the floor to steer around.
#
# These are thrown away before they become facts. The test is whether a wheel could reach it. A
# curtain hangs to the floor and a standard lamp stands on it, so neither is here; both are
# furniture. A window is in a wall, so it is.
#
# The reason the list exists at all: a word that reaches no group becomes `unknown_obstacle`, and
# `unknown_obstacle` still stops the walker at 0.70 m. Without this list the walker would stop for a
# shirt.
#
# The word that forced it is `window`. Every Open Images model tested reports `Window` in all three
# recorded stair frames at 0.49 to 0.71 confidence, more confidently than it reports the staircase,
# because the stairwell is lit from behind by a large window.
#
# Body parts and clothing are here for a second reason. Open Images labels them separately from
# `Person`, so one visitor standing in a doorway produces `Person`, `Human face`, `Human hand`,
# `Jeans` and `Footwear` as five detections at the same distance, and the description would name the
# same person five times over.
# ---------------------------------------------------------------------------

not_obstacles:

  # parts of a person, already covered by `Person`
  - human body
  - human head
  - human face
  - human hair
  - human eye
  - human ear
  - human nose
  - human mouth
  - human beard
  - human arm
  - human hand
  - human leg
  - human foot
  - skull

  # worn items, already covered by `Person`
